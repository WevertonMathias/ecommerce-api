spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Nunca usar "update" ou "create" - o schema é controlado 100% pelo Flyway
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Documentação da API (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Health-check e observabilidade
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Configurações próprias da aplicação (JWT)
app:
  jwt:
    secret: ${JWT_SECRET:troque-este-valor-por-uma-chave-secreta-bem-grande-e-aleatoria}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: 8080
